[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collection-email"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer",
    "pydantic>=2",
    "openpyxl",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
collection-email = "collection_email.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collection_email = ["emails/templates/*.j2", "responses/*.json"]
